apply plugin: 'com.android.library'

group = 'expo.modules.vault'
version = '0.7.2'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 21)
      targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }
  }
}

android {
  namespace "expo.modules.vault"
  defaultConfig {
    versionCode 1
    versionName "0.7.2"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.all { test ->
      // The suites read the vectors shared with the Swift tests.
      test.systemProperty 'vault.fixtures', file('../tests/fixtures').absolutePath
      // Robolectric downloads its Android runtime into <user.home>/.m2; keep
      // it in the Gradle user home with the rest of the build's downloads.
      // Robolectric 4.17 cannot load its native runtime from a path with a
      // space in it; ROBOLECTRIC_HOME points elsewhere (a symlink will do).
      def robolectricHome = System.getenv('ROBOLECTRIC_HOME')
        ? new File(System.getenv('ROBOLECTRIC_HOME'))
        : new File(gradle.gradleUserHomeDir, 'robolectric-home')
      test.systemProperty 'user.home', robolectricHome.absolutePath
      test.doFirst { robolectricHome.mkdirs() }
    }
  }
}

dependencies {
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
  implementation "androidx.biometric:biometric:1.1.0"

  testImplementation 'junit:junit:4.13.2'
  // Real android.util.Base64, org.json and android.system.Os on the JVM, which
  // the backup container uses.
  testImplementation 'org.robolectric:robolectric:4.17'
}
